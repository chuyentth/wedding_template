<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tài & Thương — Wedding</title><meta name="description" content="Wedding website"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><main class="site-shell">
<section class="hero" id="cover"><img class="hero__image" id="heroImage"><div class="hero__overlay"></div><div class="hero__content"><p class="hero__eyebrow" id="heroEyebrow"></p><h1><span id="groomName"></span> &amp; <span id="brideName"></span></h1><p class="hero__date" id="weddingDate"></p><p class="hero__invite" id="heroInvite"></p></div><a class="hero__scroll" href="#story"><b id="scrollLabel"></b><span>⌄</span></a></section>
<section class="section story" id="story"><div class="section-heading"><h2 id="storyHeading"></h2><img class="botanical botanical--heading decor-image" alt=""></div><p class="section-intro mono" id="storyIntro"></p><div class="timeline" id="storyTimeline"></div></section>
<section class="section events"><div class="section-heading"><h2 id="eventsHeading"></h2><img class="botanical botanical--heading decor-image" alt=""></div><div class="event-grid" id="eventGrid"></div><p class="dress-code" id="dressCode"></p><img class="event-photo" id="eventImage"></section>
<section class="section gallery"><div class="section-heading"><h2 id="galleryHeading"></h2><img class="botanical botanical--heading decor-image" alt=""></div><div class="gallery-grid" id="galleryGrid"></div></section>
<section class="section location"><div class="section-heading"><h2 id="locationHeading"></h2><img class="botanical botanical--heading decor-image" alt=""></div><p class="section-intro" id="locationIntro"></p><img class="map-card" id="mapImage"><div class="location-cards" id="locationCards"></div></section>
<section class="section rsvp"><div class="section-heading"><h2 id="rsvpHeading"></h2><img class="botanical botanical--heading decor-image" alt=""></div><p class="section-intro" id="rsvpIntro"></p><form class="rsvp-form" id="rsvpForm"><fieldset class="attendance-options"><label><input type="radio" name="attendance" value="Tham dự" checked><span id="attendYesLabel"></span></label><label><input type="radio" name="attendance" value="Không tham dự"><span id="attendNoLabel"></span></label></fieldset><input id="rsvpName" name="name" type="text" required><input id="rsvpGuests" name="guests" type="number" min="0" step="1" required><textarea id="rsvpMessage" name="message"></textarea><button class="button button--full" type="submit" id="rsvpSubmit"></button><p class="form-status" id="formStatus" role="status" aria-live="polite"></p><p class="form-note" id="formNote"></p></form></section>
<section class="section gift"><div class="section-heading"><h2 id="giftHeading"></h2><img class="botanical botanical--heading decor-image" alt=""></div><p class="section-intro" id="giftIntro"></p><img class="qr-image" id="qrImage" alt="Mã QR chuyển khoản"><p class="bank-name" id="bankName"></p><h3 id="accountHolder"></h3><button class="account-number" id="copyAccount"></button><p class="copy-hint" id="copyHint"></p><div class="divider"></div><h3 class="thanks" id="thanksText"></h3><p class="goodbye" id="goodbyeText"></p></section>
</main><script src="config.js"></script><script src="app.js"></script></body></html>
